name: Windows CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: windows-latest
    
    env:
      SOLUTION_FILE: DesktopAutomationTest.slnx
      TEST_PROJECT: DesktopAutomationTest.Tests/DesktopAutomationTest.Tests.csproj
      CONFIGURATION: Release
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Build
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore
      
    - name: Test with retry logic for flaky tests
      shell: pwsh
      run: |
        Write-Host "Running initial test suite..."
        dotnet test $env:TEST_PROJECT `
          --configuration $env:CONFIGURATION `
          --no-build `
          --verbosity normal `
          --results-directory TestResults `
          --logger "trx;LogFileName=test_results.trx"

        if ($LASTEXITCODE -ne 0) {
            Write-Host "Initial test run failed, waiting 10 seconds before retrying flaky tests..."
            Start-Sleep -Seconds 10
            dotnet test $env:TEST_PROJECT `
              --configuration $env:CONFIGURATION `
              --no-build `
              --verbosity normal `
              --results-directory TestResults-Retry `
              --logger "trx;LogFileName=test_results_retry.trx" `
              --filter "FullyQualifiedName!~Passed"
        }
      
    - name: Collect test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_id }}
        path: |
          TestResults/**/*.trx
          TestResults-Retry/**/*.trx
        retention-days: 7
        
    - name: Collect failure artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-artifacts-${{ github.run_id }}
        path: |
          DesktopAutomationTest.Tests/TestResults/**/*
          DesktopAutomationTest.Tests/Snapshots/**/*.received.*
          DesktopAutomationTest.Tests/Baselines/**/*
          DesktopAutomationTest.Tests/TestResults/VisualDiffs/**/*
        retention-days: 14
        
    - name: Report test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Windows UI Tests
        reporter: dotnet-trx
        path: 'TestResults*/**/*.trx'
        path-replace-backslashes: 'true'
        fail-on-error: false